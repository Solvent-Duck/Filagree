[project]
name = "filagree-gestures"
version = "0.1.0"
description = "Hand gestures from the laptop camera drive the Visualyze viewer"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mediapipe==1.0.1",
  "opencv-contrib-python>=4.11,<5",
  "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv]
package = false
